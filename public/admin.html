<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Dashboard | FlySkyMods</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Same theme as the store -->
  <link rel="stylesheet" href="style.css">

  <!-- Admin page logic -->
  <script src="admin.js" defer></script>
</head>
<body class="admin-page">

  <header class="site-header">
    <nav class="navbar" aria-label="Admin navigation">
      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        </span>
        <span class="logo-text">
          <span class="logo-name">FlySkyMods</span>
          <span class="logo-tagline">Admin Dashboard</span>
        </span>
      </a>
      <a href="index.html" class="btn btn-glass admin-back">← Back to store</a>
    </nav>
  </header>

  <main class="section">
    <div class="container">

      <div class="admin-header">
        <span class="section-eyebrow">Admin</span>
        <h1 class="section-title">Dashboard</h1>
        <p class="section-subtitle" id="admin-welcome">Checking your access...</p>
      </div>

      <!-- Shown when the visitor is not an admin (401 / 403 / 503) -->
      <div class="catalog-message" id="admin-blocked" hidden>
        <h3 id="blocked-title">Admin access only</h3>
        <p id="blocked-text"></p>
        <a href="index.html" class="btn admin-blocked-btn">Go to the store</a>
      </div>

      <!-- Dashboard content (admins only) -->
      <div id="admin-content" hidden>

        <ul class="admin-stats">
          <li><strong id="stat-users">0</strong><span>Registered users</span></li>
          <li><strong id="stat-admins">0</strong><span>Admins</span></li>
          <li><strong id="stat-new">0</strong><span>Joined in the last 7 days</span></li>
        </ul>

        <!-- Section tabs -->
        <div class="admin-tabs" role="tablist">
          <button type="button" class="admin-tab active" role="tab" data-panel="panel-users">Users</button>
          <button type="button" class="admin-tab" role="tab" data-panel="panel-products">Products</button>
        </div>

        <!-- ===== USERS ===== -->
        <section class="admin-panel" id="panel-users">
          <div class="admin-panel-header">
            <h2>Users</h2>
          </div>
          <div class="table-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col">Joined</th>
                </tr>
              </thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>

        <!-- ===== PRODUCTS ===== -->
        <section class="admin-panel" id="panel-products" hidden>
          <div class="admin-panel-header">
            <h2>Products</h2>
            <button type="button" class="btn" id="add-product-btn">+ Add product</button>
          </div>

          <!-- Add / edit form -->
          <form class="admin-form" id="product-form" hidden novalidate>
            <h3 id="product-form-title">Add product</h3>
            <div class="auth-message" id="product-message" role="alert" hidden></div>

            <div class="admin-form-grid">
              <div class="form-group">
                <label for="p-name">Name</label>
                <input type="text" id="p-name" maxlength="100" required>
              </div>
              <div class="form-group">
                <label for="p-version">Version</label>
                <input type="text" id="p-version" maxlength="30" placeholder="e.g. 1.0.2" required>
              </div>
              <div class="form-group">
                <label for="p-category">Category</label>
                <select id="p-category" required>
                  <option value="Aircraft">Aircraft</option>
                  <option value="Liveries">Liveries</option>
                  <option value="Airports">Airports</option>
                  <option value="Scenery">Scenery</option>
                  <option value="Utilities">Utilities</option>
                  <option value="Enhancements">Enhancements</option>
                </select>
              </div>
              <div class="form-group">
                <label for="p-price">Price (₹, 0 = free)</label>
                <input type="number" id="p-price" min="0" step="1" required>
              </div>
              <div class="form-group">
                <label for="p-developer">Developer</label>
                <input type="text" id="p-developer" maxlength="80" required>
              </div>
            </div>
            <div class="form-group">
              <label for="p-description">Description</label>
              <textarea id="p-description" rows="3" maxlength="2000" required></textarea>
            </div>

            <div class="admin-form-actions">
              <button type="submit" class="btn">Save product</button>
              <button type="button" class="btn btn-glass" id="cancel-product-btn">Cancel</button>
            </div>
          </form>

          <p class="admin-hint" id="storage-hint"></p>

          <div class="table-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Category</th>
                  <th scope="col">Price</th>
                  <th scope="col">Download file</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="products-body"></tbody>
            </table>
          </div>

          <!-- Hidden file pickers, opened by the row buttons -->
          <input type="file" id="image-picker" accept="image/png,image/jpeg,image/webp" hidden>
          <input type="file" id="file-picker" hidden>
        </section>

      </div>
    </div>
  </main>

</body>
</html>

# =========================================================
# FlySkyMods - Continuous Integration (CI) workflow
# Runs the automated Jest + Supertest tests on GitHub's
# servers every time code is pushed or a Pull Request is opened.
# =========================================================

name: FlySkyMods CI

# ---- WHEN the workflow runs (triggers) ----
on:
  push:
    branches:
      - main
      - "feature/**"   # any feature branch, e.g. feature/search-filter
      - "docs/**"
  pull_request:
    branches:
      - main           # PRs that want to merge into main

# Give the workflow read-only access to the repository (safer default)
permissions:
  contents: read

# ---- WHAT the workflow does ----
jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest   # a fresh Linux virtual machine (the "runner")

    steps:
      # 1. Download the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Node.js 22 (same version as the Hostinger production app)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"         # re-use downloaded packages to speed up runs

      # 3. Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run Jest + Supertest. If any test fails, this step fails
      #    and the whole workflow is marked FAIL (red X).
      - name: Run automated tests
        run: npm test

  # =======================================================
  # CONTINUOUS DEPLOYMENT (CD)
  # Runs ONLY when:
  #   1. code is pushed/merged into main, AND
  #   2. the "test" job above has passed.
  # It copies the tested main branch to the "production" branch.
  # Hostinger watches the production branch and redeploys
  # flyskymods.com automatically whenever it changes.
  # If tests fail, this job is skipped and the live site
  # stays on the last working version.
  # =======================================================
  deploy:
    name: Deploy to production
    needs: test                 # wait for tests; skip if they fail
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # This job needs permission to update the production branch
    permissions:
      contents: write

    # Never run two deployments at the same time
    concurrency: production

    steps:
      # 1. Download the tested main branch
      - name: Checkout tested code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Make the production branch identical to main
      - name: Update production branch
        run: git push origin HEAD:production --force

      # 3. Print a summary on the Actions run page
      - name: Deployment summary
        run: |
          echo "### 🚀 Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "Hostinger will now redeploy https://flyskymods.com" >> $GITHUB_STEP_SUMMARY
